version: "3.8"
services:
  webapi:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: requisitionapi
    networks:
      - requisitionapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__requisitionapi=Host=postgres;Port=5432;Database=requisitionDB;Username=postgres;Password=postgres
    ports:
      - 5080:80
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  postgres:
    container_name: postgres
    image: postgres:15-alpine
    networks:
      - requisitionapi
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=requisitionDB
    ports:
      - 5432:5432
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgresdata:

networks:
  requisitionapi:
